name: Deploy to Azure App Service (Dev)

# Trigger manually or on pushes to the dev branch.
on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  AZURE_WEBAPP_NAME_API: rent-a-car-api-dev
  AZURE_WEBAPP_NAME_WEB: rent-a-car-web-dev
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API (Dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Build API
        run: npm run build --workspace=@rent-a-car/api

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_API }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API_DEV }}
          package: apps/api
          startup-command: node dist/main.js

  deploy-web:
    name: Deploy Web (Dev)
    runs-on: ubuntu-latest
    environment: dev
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Next.js
        run: npm run build --workspace=@rent-a-car/web
        env:
          AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.DEV_NEXTAUTH_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_NEXT_PUBLIC_API_URL }}

      - name: Deploy Web to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_WEB }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB_DEV }}
          package: apps/web
          startup-command: node server.js
