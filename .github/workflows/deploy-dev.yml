name: Deploy to Azure App Service (Dev)

# Trigger manually or on pushes to the dev branch.
on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  AZURE_WEBAPP_NAME: mtp-code01
  AZURE_SLOT_API: rent-a-car-backend
  AZURE_SLOT_WEB: rent-a-car-frontend
  NODE_VERSION: '20'

jobs:
  deploy-api:
    name: Deploy API (Dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@rent-a-car/api

      - name: Prepare DATABASE_URL for migrations
        run: |
          DB_URL='${{ secrets.DEV_DATABASE_URL }}'
          echo "Preparing DATABASE_URL for prisma migrate"
          if [[ -z "$DB_URL" ]]; then
            echo "DATABASE_URL=file:./prisma/dev.db" >> $GITHUB_ENV
          elif [[ "$DB_URL" == file:/* ]]; then
            # Absolute file paths (e.g. App Service /home/site) are not writable on the GitHub runner; use a local sqlite file for CI
            echo "DATABASE_URL=file:./prisma/dev.db" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Build API
        run: npm run build --workspace=@rent-a-car/api

      # The repo is an npm workspace: dependencies are hoisted to the root
      # node_modules, so deploying apps/api alone ships no usable deps.
      # Assemble a self-contained package instead. App Service runs
      # "npm start" by default (startup-command is unsupported with
      # publish-profile auth), so the start script must boot production code.
      - name: Assemble self-contained API package
        run: |
          mkdir -p deploy-api
          cp -r apps/api/dist deploy-api/dist
          cp -r apps/api/prisma deploy-api/prisma
          node <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'));
          fs.writeFileSync('deploy-api/package.json', JSON.stringify({
            name: pkg.name,
            version: pkg.version,
            private: true,
            scripts: {
              // migrate the on-server database, seed dummy data if the db is empty,
              // then boot; never block startup on migrate/seed failures.
              // nest build emits dist/src/main.js (prisma/*.ts is compiled too, keeping the src/ prefix)
              start: "(npx prisma migrate deploy || echo 'WARN: prisma migrate deploy failed') && (node dist/prisma/seed-if-empty.js || echo 'WARN: seed-if-empty failed') && node dist/src/main.js",
            },
            dependencies: pkg.dependencies,
          }, null, 2));
          EOF
          cd deploy-api
          npm install --omit=dev --no-audit --no-fund
          npx prisma generate
        shell: bash

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_API }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API_DEV }}
          package: deploy-api

  deploy-web:
    name: Deploy Web (Dev)
    runs-on: ubuntu-latest
    environment: dev
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Next.js
        run: npm run build --workspace=@rent-a-car/web
        env:
          AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.DEV_NEXTAUTH_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.DEV_NEXT_PUBLIC_API_URL }}

      # next.config.ts uses output:'standalone', which emits a minimal server
      # with its own node_modules under .next/standalone. In a monorepo the
      # layout mirrors the repo, so the server entry is apps/web/server.js.
      # Static assets and public/ are not included and must be copied in.
      - name: Assemble self-contained Web package
        run: |
          mkdir -p deploy-web
          cp -r apps/web/.next/standalone/. deploy-web/
          test -f deploy-web/apps/web/server.js || { echo "server.js not at expected path; standalone layout:"; find deploy-web -maxdepth 3 -name server.js; exit 1; }
          mkdir -p deploy-web/apps/web/.next
          cp -r apps/web/.next/static deploy-web/apps/web/.next/static
          cp -r apps/web/public deploy-web/apps/web/public
          node <<'EOF'
          const fs = require('fs');
          fs.writeFileSync('deploy-web/package.json', JSON.stringify({
            name: '@rent-a-car/web-deploy',
            private: true,
            scripts: {
              // HOSTNAME can be set to the container id on App Service; force 0.0.0.0
              start: 'HOSTNAME=0.0.0.0 node apps/web/server.js',
            },
          }, null, 2));
          EOF
        shell: bash

      - name: Deploy Web to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_WEB }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB_DEV }}
          package: deploy-web
